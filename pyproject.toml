[project]
name = "jobtrack"
version = "0.1.0"
description = "Polls job sources, filters CS internships, and delivers matches to Discord"
readme = "README.md"
authors = [
    { name = "Jialiang Cao", email = "jcao2080@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx[http2]>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "sentry-sdk>=2.19",
    "typer>=0.15",
    "playwright==1.61.0",
    "selectolax>=0.3.27",
]

[project.scripts]
jobtrack = "jobtrack.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
    "pyright>=1.1.391",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "ASYNC",     # async pitfalls
    "DTZ",       # naive datetimes
    "PT",        # pytest style
]
ignore = [
    "E501",      # line length handled by formatter
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
