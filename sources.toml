# Declarative source list. Apply with: jobtrack sources sync
#
#   kind      greenhouse | lever | ashby | smartrecruiters | workable | workday | scrape
#   name      display name; (kind, name) identifies the source, so renaming adds a new one
#   slug      board token from the company's job-board URL (slug-addressed ATS kinds)
#   url       careers page (workday and scrape kinds)
#   enabled   omit to leave the DB alone — the circuit breaker also writes this field
#
# Optional per-source tuning:
#   adapter    = "fallback"
#   politeness = { max_concurrency = 1, min_delay_ms = 3000, max_delay_ms = 6000 }
#
# Workday-only tuning (all optional — the defaults are derived from `url`):
#   tenant           = "acme-inc"      # override; defaults to the first host label
#   site             = "Careers"       # override; defaults to the last path segment
#   worker_sub_types = ["<facet-id>"]  # skip facet discovery, apply these ids verbatim
#   max_pages        = 40              # raise the 25-page (500-posting) crawl cap
#
# Every slug below was verified against the live API on 2026-07-29 (52 added 2026-08-03) and
# returned at least one posting. Boards were collected from the SimplifyJobs
# Summer2026-Internships, Summer2027-Internships and New-Grad-Positions listings (slugs read
# straight out of real job URLs) plus a hand-built sweep of tech companies, AI labs, quant
# shops and startups; guessed slugs were kept only when the board's own advertised name
# matched the company.
#
# Ashby slugs are case-sensitive and may contain spaces ("Flock Safety") — copy them from the
# job URL verbatim and let httpx encode them; do not slugify.
#
# Before adding one, confirm the board answers:
#   curl -s "https://boards-api.greenhouse.io/v1/boards/<slug>/jobs" | jq '.jobs | length'
#   curl -s "https://api.ashbyhq.com/posting-api/job-board/<slug>" | jq '.jobs | length'
#   curl -s "https://api.lever.co/v0/postings/<slug>?mode=json" | jq 'length'
# A 404 or a count of 0 means the slug is wrong or the board is empty — jobtrack will
# report a healthy fetch of zero jobs either way, so it fails silently if you skip this.
#
# Every tenant below is its own subdomain but they share one rate limit per client IP, so
# polite_http paces the whole provider as a single group (measured: 15 req/s sustained is
# fine, 25 req/s starts returning 429). Adding boards here lengthens the run rather than
# widening the request rate — check the run duration against RUN_INTERVAL_SECONDS.
#
# Workday takes a URL rather than a slug: copy the careers page verbatim, e.g.
# "https://nvidia.wd5.myworkdayjobs.com/en-US/NVIDIAExternalCareerSite". The site segment
# is the part people get wrong, so check it — of three tenants guessed while building this
# fetcher, two answered HTTP 400 or a total of 0:
#   curl -s -X POST "https://<host>/wday/cxs/<tenant>/<site>/jobs" \
#     -H 'Content-Type: application/json' \
#     -d '{"appliedFacets":{},"limit":20,"offset":0,"searchText":""}' | jq '.total'
#
# Workday narrows its crawl using whichever of the board's own facets classifies interns —
# "workerSubType" (Intern, New College Graduate...) on about 40% of boards, otherwise
# "jobFamilyGroup" or "jobFamily" (Internships, Early Careers...). Roughly half of all
# boards expose no such facet; those crawl up to `max_pages` in the board's default order,
# and a board with more than 500 postings is truncated there — raise `max_pages` for any
# large board you care about. To pin the facet instead, read the ids out of the `.facets`
# block of the curl above and set `worker_sub_types`.


