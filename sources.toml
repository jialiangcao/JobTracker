# Declarative source list. Apply with: jobtrack sources sync
#
#   kind      greenhouse | lever | ashby | smartrecruiters | workable | scrape
#   name      display name; (kind, name) identifies the source, so renaming adds a new one
#   slug      board token from the company's job-board URL (ATS kinds)
#   url       careers page (scrape kind only)
#   enabled   omit to leave the DB alone — the circuit breaker also writes this field
#
# Optional per-source tuning:
#   adapter    = "fallback"
#   politeness = { max_concurrency = 1, min_delay_ms = 3000, max_delay_ms = 6000 }
#
# Every slug below was verified against the live API on 2026-07-29 and returned at least one
# posting. Boards were collected from the SimplifyJobs Summer2026-Internships and
# New-Grad-Positions listings (slugs read straight out of real job URLs) plus a hand-built
# sweep of tech companies, AI labs, quant shops and startups; guessed slugs were kept only
# when the board's own advertised name matched the company.
#
# Before adding one, confirm the board answers:
#   curl -s "https://boards-api.greenhouse.io/v1/boards/<slug>/jobs" | jq '.jobs | length'
#   curl -s "https://api.ashbyhq.com/posting-api/job-board/<slug>" | jq '.jobs | length'
#   curl -s "https://api.lever.co/v0/postings/<slug>?mode=json" | jq 'length'
# A 404 or a count of 0 means the slug is wrong or the board is empty — jobtrack will
# report a healthy fetch of zero jobs either way, so it fails silently if you skip this.


