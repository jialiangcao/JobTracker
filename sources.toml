# Declarative source list. Apply with: jobtrack sources sync
#
#   kind      greenhouse | lever | ashby | smartrecruiters | workable | workday | scrape
#   name      display name; (kind, name) identifies the source, so renaming adds a new one
#   slug      board token from the company's job-board URL (slug-addressed ATS kinds)
#   url       careers page (workday and scrape kinds)
#   enabled   omit to leave the DB alone — the circuit breaker also writes this field
#
# Optional per-source tuning:
#   adapter    = "fallback"
#   politeness = { max_concurrency = 1, min_delay_ms = 3000, max_delay_ms = 6000 }
#
# Workday-only tuning (all optional — the defaults are derived from `url`):
#   tenant           = "acme-inc"      # override; defaults to the first host label
#   site             = "Careers"       # override; defaults to the last path segment
#   worker_sub_types = ["<facet-id>"]  # skip facet discovery, apply these ids verbatim
#   max_pages        = 40              # raise the 25-page (500-posting) crawl cap
#
# Every slug below was verified against the live API on 2026-07-29 (52 added 2026-08-03,
# 813 + 43 + 4737 added 2026-08-04) and returned at least one posting. Boards were collected from the
# SimplifyJobs Summer2026-Internships, Summer2027-Internships and New-Grad-Positions listings
# (slugs read straight out of real job URLs) plus a hand-built sweep of tech companies, AI
# labs, quant shops and startups; guessed slugs were kept only when the board's own advertised
# name matched the company.
#
# The 2026-08-04 batch came from the yc-oss company API (https://github.com/yc-oss/api, all
# active/public companies) plus a hand-built sweep of the verticals the SimplifyJobs lists
# under-cover — space/defense, fusion and climate, techbio, European and Israeli startups,
# devtools and AI infra. Two signals per company: ATS links scraped off the company's own
# careers page (exact slugs), then name-derived slug guesses. Where a guessed slug hit a board
# whose advertised name only loosely matched, the entry is labelled with the board's own name,
# since that is the authoritative one -- so a few names here differ from the company searched
# for.
#
# The 4737 boards added 2026-08-04 came from Common Crawl instead of a company list, which
# inverts the usual problem: the crawl already contains the ATS URLs, so slugs are read off
# real URLs and never guessed. Recipe, ~2 minutes end to end:
#   1. Fetch cluster.idx for the crawl (~100MB), the sparse surtkey -> (shard, offset, len) map:
#      https://data.commoncrawl.org/cc-index/collections/CC-MAIN-<id>/indexes/cluster.idx
#   2. Keep the blocks overlapping each ATS host's SURT prefix — "com,ashbyhq,jobs)",
#      "io,greenhouse,boards)", "com,myworkdayjobs," (SURT reverses host labels, so that one
#      prefix covers every tenant subdomain). 66 blocks / 19MB for the eight prefixes.
#   3. HTTP range-GET those blocks, gunzip, take the first path segment as the slug (or
#      tenant+site for workday), and drop app routes: robots.txt, /embed, /api ...
# Do NOT use the columnar (Parquet) index for this — a surtkey LIKE predicate does not prune
# row groups, so it pulls the whole column per file and takes hours for the same answer. The
# CDX API cannot serve host-wildcard queries at all; it 504s.
#
# Lever is absent from this batch and always will be: jobs.lever.co/robots.txt sets
# "User-agent: CCBot / Disallow: /", so the only lever records in the crawl are copies of
# robots.txt itself. Lever boards still have to come from company lists.
#
# Every candidate was then fetched through the real fetcher+adapter path and kept only if at
# least one live posting matched the seeded cs:* rules with the season (intern) group dropped
# — i.e. the board actually posts software roles, intern or not. 11571 candidates -> 7961 live
# -> 4737 kept. Workable rate-limits hard at the default pacing; its boards were re-probed at
# max_concurrency=2 / 700-1400ms, which recovered 577 boards that first read as dead.
#
# Ashby slugs are case-sensitive and may contain spaces ("Flock Safety") — copy them from the
# job URL verbatim and let httpx encode them; do not slugify.
#
# Before adding one, confirm the board answers:
#   curl -s "https://boards-api.greenhouse.io/v1/boards/<slug>/jobs" | jq '.jobs | length'
#   curl -s "https://api.ashbyhq.com/posting-api/job-board/<slug>" | jq '.jobs | length'
#   curl -s "https://api.lever.co/v0/postings/<slug>?mode=json" | jq 'length'
# A 404 or a count of 0 means the slug is wrong or the board is empty — jobtrack will
# report a healthy fetch of zero jobs either way, so it fails silently if you skip this.
#
# Every tenant below is its own subdomain but they share one rate limit per client IP, so
# polite_http paces the whole provider as a single group (measured: 15 req/s sustained is
# fine, 25 req/s starts returning 429). Adding boards here lengthens the run rather than
# widening the request rate — check the run duration against RUN_INTERVAL_SECONDS.
#
# Workday takes a URL rather than a slug: copy the careers page verbatim, e.g.
# "https://nvidia.wd5.myworkdayjobs.com/en-US/NVIDIAExternalCareerSite". The site segment
# is the part people get wrong, so check it — of three tenants guessed while building this
# fetcher, two answered HTTP 400 or a total of 0:
#   curl -s -X POST "https://<host>/wday/cxs/<tenant>/<site>/jobs" \
#     -H 'Content-Type: application/json' \
#     -d '{"appliedFacets":{},"limit":20,"offset":0,"searchText":""}' | jq '.total'
#
# Don't guess the site segment — the tenant's robots.txt lists every site it hosts, including
# the intern/university boards that the public careers page never links to:
#   curl -s "https://<tenant>.<wdN>.myworkdayjobs.com/robots.txt"
#   # Sitemap: https://sonos.wd1.myworkdayjobs.com/Student_Opportunities/siteMap.xml
#   # Allow: /Student_Opportunities/
# A tenant that does not exist returns nothing on every shard, so this doubles as a cheap
# tenant check. Shards seen in this file, most common first: wd1 wd5 wd3 wd12 wd501 wd108
# wd103 wd503 wd10 wd504. Certificate transparency is useless here (Workday serves wildcard
# *.wdN.myworkdayjobs.com certs) and careers pages render the Workday link in JS, so robots.txt
# is the only reliable discovery path found so far. Many listed sites are seasonal and answer
# a total of 0 — always verify with the POST above before adding.
#
# The 43 workday sites added 2026-08-04 came from replaying that robots.txt scan over the
# tenants already listed here and keeping the early-career sites that were not yet tracked.
#
# Workday narrows its crawl using whichever of the board's own facets classifies interns —
# "workerSubType" (Intern, New College Graduate...) on about 40% of boards, otherwise
# "jobFamilyGroup" or "jobFamily" (Internships, Early Careers...). Roughly half of all
# boards expose no such facet; those crawl up to `max_pages` in the board's default order,
# and a board with more than 500 postings is truncated there — raise `max_pages` for any
# large board you care about. To pin the facet instead, read the ids out of the `.facets`
# block of the curl above and set `worker_sub_types`.


